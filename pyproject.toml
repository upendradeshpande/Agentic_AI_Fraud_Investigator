[project]
name = "ai-investigation-cockpit"
version = "0.1.0"
description = "AI-first case review for insurance fraud investigators"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40,<2", "plotly>=5.20", "altair>=5.0", "pandas>=2.1", "numpy>=1.26", "scipy>=1.11",
  "scikit-learn>=1.4", "openpyxl>=3.1", "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
adk = ["google-adk>=1.0", "litellm>=1.40"]
mcp = ["mcp>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
